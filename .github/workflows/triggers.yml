name: triggers

on:
  push: 
      branches: 
          - 'main'
          - 'aprendiendo-github-actions'



  pull_request:
      branches:
        - 'aprendiendo-github-actions'
      types:
          - opened
          - synchronize
          - reopened

  schedule:
      - cron: '*/15 * * * *'



jobs:
  imprimir-hola-mundo:
    name: imprimir hola mundo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: script-running
        run: python -c "print('hola-mundo')"

